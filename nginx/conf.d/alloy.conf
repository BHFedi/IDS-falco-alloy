server {
    # HTTP/3 (QUIC) and HTTP/2 listeners
    listen 443 ssl;
    listen 443 quic reuseport;
    
    http3 on;  # Critical: Enables HTTP/3 support
    
    server_name alloy.local;

    # TLS Certificates
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # HTTP/3 Headers
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header QUIC-Status $quic always;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy to Alloy service
    location / {
        proxy_pass http://alloy:12345;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection keepalive optimization
        proxy_set_header Connection "";
    }
}
