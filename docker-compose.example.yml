services:
  falco:
    image: falcosecurity/falco:latest
    container_name: falco-client-0
    hostname: falco-client-0
    privileged: true
    restart: unless-stopped
    volumes:
      - ./falco-agent/config/falco.yaml:/etc/falco/falco.yaml:ro
      - ./falco-agent/config/rules.d:/etc/falco/rules.d:rw
      - ./falco-agent/config/rules:/etc/falco/rules:ro
      - ./falco-agent/falco-plugins:/usr/lib/falco/plugins:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro  # Host socket (note: exposing this has security implications)
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    environment:
      - HOST_ROOT=/host
      - FALCOCTL_DRIVER_TYPE=modern_ebpf
      - FALCO_LOG_LEVEL=debug
    networks:
      - prod-REDACTED
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rules-sync:
    build: ./rules-sync
    container_name: rules-sync
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./falco-agent/config/rules.d:/etc/falco/rules.d:rw
    environment:
      - ANALYSER_URL=https://analyser.example.local/       # redacted internal URL
      - RULES_API_KEY_FILE=/run/secrets/rules_api_key
      - WEBHOOK_API_KEY_FILE=/run/secrets/rules_sync_api_key
      - SYNC_INTERVAL_SECONDS=60
    secrets:
      - rules_api_key
      - rules_sync_api_key
    networks:
      - prod-REDACTED
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    hostname: collector-01
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/var/log:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ROOT=/host/root
      - PROMETHEUS_URL=https://prometheus.example.local/api/v1/write  # redacted
      - LOKI_URL=https://loki.example.local/api/v1/push              # redacted
      - /var/lib/GeoIP:/host/root/var/lib/GeoIP:ro
    secrets:
      - loki_api_key
      - prom_api_key
    pid: host
    networks:
      - prod-REDACTED

  fail2ban-exporter:
    image: registry.gitlab.com/hctrdev/fail2ban-prometheus-exporter:latest
    container_name: fail2ban-exporter
    restart: unless-stopped
    volumes:
      - /var/run/fail2ban:/var/run/fail2ban:ro
    networks:
      - prod-REDACTED

secrets:
  loki_api_key:
    file: ./secrets/nginx/loki_api_key.txt
  prom_api_key:
    file: ./secrets/nginx/prom_api_key.txt
  rules_api_key:
    file: ./secrets/rules_api_key.txt
  rules_sync_api_key:
    file: ./secrets/rules_sync_api_key.txt

volumes:
  alloy-data:

networks:
  prod-REDACTED:
    driver: bridge

